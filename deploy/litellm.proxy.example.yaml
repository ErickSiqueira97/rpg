# Equivalente ao roteador embutido no processo (SDK).
# O app não lê este arquivo. Use só se quiser subir o proxy LiteLLM à parte
# (`litellm --config deploy/litellm.proxy.example.yaml`) e apontar um cliente OpenAI
# para os nomes narrador-gratis e narrador-pago.
#
# Uma implantação por provedor. Sem segunda chave do mesmo provedor.

model_list:
  - model_name: narrador-gratis
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: narrador-openrouter
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: narrador-cloudflare
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.1-8b-instruct-fast
      api_key: os.environ/CLOUDFLARE_API_TOKEN
      api_base: https://api.cloudflare.com/client/v4/accounts/SUA_CONTA/ai/v1

  - model_name: narrador-pago
    litellm_params:
      model: os.environ/LLM_PAID_MODEL
      api_key: os.environ/LLM_PAID_API_KEY

router_settings:
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 30
  fallbacks:
    - narrador-gratis:
        - narrador-openrouter
        - narrador-cloudflare
